<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The birthday of sora </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1a0b2e 0%, #2a1040 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Vazirmatn', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ساخت قلب‌ها و ستاره‌های متحرک */
        .heart, .star {
            position: absolute;
            font-size: 30px;
            animation: floatUp 5s linear infinite;
            opacity: 0.6;
            pointer-events: none;
        }
        .heart { color: #ff4d6d; }
        .star { color: #ffd700; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 30px 20px;
            border-radius: 30px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            position: relative;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff4d6d;
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.4);
            margin-bottom: 15px;
        }

        h1 {
            color: #ffb3c6;
            font-size: 2.2rem;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(255, 77, 109, 0.3);
        }

        h2 {
            color: #ffffff;
            font-size: 1.5rem;
            margin: 5px 0 15px 0;
            letter-spacing: 2px;
        }

        .message {
            color: #e0cffc;
            font-size: 1.2rem;
            line-height: 1.6;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 20px;
            border-left: 3px solid #ffd700;
        }

        .small-note {
            margin-top: 15px;
            color: #a28bbf;
            font-size: 0.9rem;
        }

        /* برای گوشی موبایل */
        @media (max-width: 480px) {
            .card { padding: 20px 15px; }
            h1 { font-size: 1.8rem; }
            .profile-img { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>

    <!-- تبریک تولد -->
    <div class="card">
        <img src="sora.jpg" alt="سورا" class="profile-img" onerror="this.src='https://via.placeholder.com/180/ffb3c6/000000?text=SORA'">
        <h1>HBD, fairy of the wild strawberries🎂</h1>
        <div class="message">
            ❤️<br>
          I wish you a forest full of flowers, a loyal little cat, and a basket overflowing with strawberries. 🌸🐈🍓✨.<br>
        </div>
        <div class="small-note">🌙 همیشه خوشبخت باشی</div>
    </div>

    <!-- اسکریپت ساخت قلب و ستاره -->
    <script>
        function createElement(className, symbol) {
            const el = document.createElement('div');
            el.className = className;
            el.innerText = symbol;
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = (Math.random() * 20 + 15) + 'px';
            el.style.animationDuration = (Math.random() * 4 + 3) + 's';
            document.body.appendChild(el);
            
            setTimeout(() => el.remove(), 7000);
        }

        setInterval(() => createElement('heart', '❤️'), 400);
        setInterval(() => createElement('star', '⭐'), 500);
        setInterval(() => createElement('star', '✨'), 600);
    </script>
</body>
</html>
